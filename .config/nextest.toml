# cargo-nextest settings. CI runs the workspace suite through nextest on
# Windows: one process per test, and test binaries run concurrently instead of
# one after another, which is where `cargo test` lost most of its time there.
# `cargo test` stays the local default; these settings only apply under
# `cargo nextest run`.

# Every test process runs with a temporary folder of its own (TMPDIR, TMP and
# TEMP), removed once it ends: kache's warn-once markers live in the
# temporary folder, and on Windows a TempDir cannot remove a folder that a
# daemon the test started still holds, or files the store made read-only.
# scripts/nextest-own-temp.{sh,cmd} say how.
experimental = ["wrapper-scripts"]

[scripts.wrapper.own-temp-unix]
command = { command-line = "scripts/nextest-own-temp.sh", relative-to = "workspace-root" }

[scripts.wrapper.own-temp-windows]
command = { command-line = "scripts/nextest-own-temp.cmd", relative-to = "workspace-root" }

[[profile.default.scripts]]
platform = 'cfg(unix)'
filter = 'all()'
run-wrapper = 'own-temp-unix'

[[profile.default.scripts]]
platform = 'cfg(windows)'
filter = 'all()'
run-wrapper = 'own-temp-windows'

[profile.default]
# Report any test past a minute so the slow ones are visible in the log, and
# end it after five: a hung test then fails as TIMEOUT instead of holding the
# run up until someone stops it. The slowest test takes about 35 s on a
# loaded Windows VM.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
# Keep reporting every two minutes; give up on a test after ten.
slow-timeout = { period = "120s", terminate-after = 5 }
# List the slow tests again at the end, after the pass/fail summary.
final-status-level = "slow"

[[profile.ci.overrides]]
platform = 'cfg(windows)'
filter = 'test(=identity::tests::earlier_lockfiles_are_read_from_git)'
# This Git fixture exercises a one-second lookup deadline. Reserve the test
# pool so other tests do not consume that deadline through process contention.
threads-required = "num-test-threads"
